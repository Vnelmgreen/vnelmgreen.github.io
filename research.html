<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research ✨ Vienna's World</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="research" data-root="">
<div class="page">
  <div id="site-header"></div>
  <main>
    <section class="window">
      <h2 class="window-title">Research &amp; publications <span class="dots" aria-hidden="true">✦ ✦ ✦</span></h2>
      <div class="window-body">
        <h1>What I'm studying 🔬</h1>
        <p>A short, friendly description of your research area. What question are you trying to answer, and why does it matter?</p>
        <div class="actions" id="profile-links" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
    </section>

    <section class="window lilac">
      <h2 class="window-title">Papers, posters &amp; projects</h2>
      <div class="window-body">
        <ul class="item-list" id="research-list"></ul>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
</div>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
</body>
</html>
