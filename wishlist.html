<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist ✨ Vienna's World</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="wishlist" data-root="">
<div class="page">
  <div id="site-header"></div>
  <main>
    <section class="window">
      <h2 class="window-title">Wishlist <span class="dots" aria-hidden="true">✦ ✦ ✦</span></h2>
      <div class="window-body">
        <h1>Gift ideas 🎁</h1>
        <p>For anyone who's asked "what do you want for your birthday?" More stars means I want it more!</p>
        <p class="note">💌 Thinking of getting something? Text a family member first so two people don't buy the same thing!</p>
      </div>
    </section>

    <section class="window peach">
      <h2 class="window-title">Things I'd love</h2>
      <div class="window-body">
        <div class="wish-filters" id="wish-filters" role="group" aria-label="Filter by category"></div>
        <ul class="item-list" id="wish-list"></ul>
      </div>
    </section>

    <section class="window sky">
      <h2 class="window-title">Cheat sheet</h2>
      <div class="window-body">
        <ul id="favorites"></ul>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
</div>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
</body>
</html>
