<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcade ✨ Vienna's World</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="arcade" data-root="">
<div class="page">
  <div id="site-header"></div>
  <main>
    <section class="window">
      <h2 class="window-title">Arcade <span class="dots" aria-hidden="true">✦ ✦ ✦</span></h2>
      <div class="window-body">
        <h1>Toys to play with 🎮</h1>
        <p>Little things to shake, swirl and play with. More coming soon!</p>
      </div>
    </section>

    <div class="grid">
      <section class="window sky">
        <h2 class="window-title">Snowglobe</h2>
        <div class="window-body"><div class="coming-soon"><span class="emoji" aria-hidden="true">🔮</span>Shake it and watch the glitter swirl. Coming soon!</div></div>
      </section>
      <section class="window peach">
        <h2 class="window-title">Glitter jar</h2>
        <div class="window-body"><div class="coming-soon"><span class="emoji" aria-hidden="true">✨</span>A calming jar of liquid glitter. Coming soon!</div></div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
</div>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
</body>
</html>
