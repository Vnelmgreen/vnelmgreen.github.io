<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Webkinz ✨ Vienna's World</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="webkinz" data-root="">
<div class="page">
  <div id="site-header"></div>
  <main>
    <section class="window">
      <h2 class="window-title">My Webkinz <span class="dots" aria-hidden="true">✦ ✦ ✦</span></h2>
      <div class="window-body">
        <h1>Welcome to the adoption center! 🐾</h1>
        <p>Every one of my Webkinz, straight from my collection spreadsheet. Hover over a pet to say hi!</p>
        <div class="stats" id="pet-stats"></div>
      </div>
    </section>

    <section class="window sky">
      <h2 class="window-title">Zodiac signs</h2>
      <div class="window-body"><div id="sign-chart"></div></div>
    </section>

    <div class="grid">
      <section class="window sky">
        <h2 class="window-title">Zodiac elements</h2>
        <div class="window-body"><div id="element-chart"></div></div>
      </section>

      <section class="window">
        <h2 class="window-title">Pet groups</h2>
        <div class="window-body"><div class="stats" id="group-tiles"></div></div>
      </section>
    </div>

    <section class="window lilac">
      <h2 class="window-title">The whole family</h2>
      <div class="window-body">
        <div class="grid pet-grid" id="pet-grid"><p>Fetching the pets… 🐾</p></div>
      </div>
    </section>

  </main>
  <div id="site-footer"></div>
</div>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
</body>
</html>
